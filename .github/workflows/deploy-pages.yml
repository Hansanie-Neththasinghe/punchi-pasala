name: Build and Deploy (GitHub Pages)

on:
  push:
    branches: [ main, DEV/Hansanie ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      # Prepare and upload build output
      - name: Prepare build output
        run: |
          mkdir -p out
          cp -r .next/static out/_next/static
          cp -r public/* out/
          touch out/.nojekyll

      # Copy index page
      - name: Copy index page
        run: |
          if [ -f ".next/server/pages/index.html" ]; then
            cp .next/server/pages/index.html out/
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
